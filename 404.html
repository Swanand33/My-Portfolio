<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Swanand Potnis</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f2efe8; --ink: #191811; --body: #46422f; --muted: #6c6757; --rule: #d8d3c7; --accent: #ad4427; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Archivo, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; border-radius: 10px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    a:hover { color: var(--accent); }
    main { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; padding: 40px 20px; }
    .box { max-width: 640px; margin: 0 auto; width: 100%; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 18px 0 0; font-size: clamp(40px, 8vw, 68px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; }
    p { margin: 24px 0 0; font-size: 18px; line-height: 1.6; color: var(--body); max-width: 46ch; }
    .btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
    .btn { display: inline-block; padding: 14px 24px; font-size: 14.5px; font-weight: 500; border: 1px solid var(--rule); color: var(--body); transition: background .15s, color .15s, border-color .15s; }
    .btn:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .btn-solid { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .btn-solid:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .note { margin-top: 28px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); min-height: 1em; }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <div class="mono">404</div>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be old or mistyped. Everything lives on the main page.</p>
      <div class="btns">
        <a href="/" class="btn btn-solid">Back to portfolio</a>
        <a href="https://www.linkedin.com/in/swanandpotnis/" target="_blank" rel="noopener" class="btn">LinkedIn ↗</a>
      </div>
    </div>
  </main>
</body>
</html>
